{% extends "base.html" %}
{% block title %}สมัครบัญชี{% endblock %}
{% block content %}
<h1>สมัครบัญชี</h1>
<form method="post" class="form">
  <label for="username">ชื่อผู้ใช้</label>
  <input type="text" id="username" name="username" required />

  <label for="email">Gmail / อีเมล์{% if not force_email %} <span class="hint">(ไม่จำเป็น)</span>{% endif %}</label>
  <input type="email" id="email" name="email" autocomplete="email" {% if force_email %}required{% endif %} />

  <label for="password">รหัสผ่าน</label>
  <input type="password" id="password" name="password" autocomplete="new-password" required />

  <label for="password_confirm">ยืนยันรหัสผ่าน</label>
  <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" required />

  {% if form_error %}
    <div class="flash error" style="margin-bottom:1rem;">{{ form_error }}</div>
  {% endif %}

  {% if TURNSTILE_ENABLED %}
    <div class="cf-turnstile" style="margin-top:12px;margin-bottom:12px;"
         data-sitekey="{{ TURNSTILE_SITE_KEY }}" data-theme="dark" data-language="th"></div>
  {% endif %}

  <button type="submit" class="btn primary">สมัครสมาชิก</button>
</form>
<p class="auth-switch">
  มีบัญชีแล้ว? <a href="{{ url_for('user_login') }}">เข้าสู่ระบบ</a>
  {% if ACCOUNT_RECOVERY_ENABLED %}<span style="margin:0 0.35rem;">|</span><a href="{{ url_for('recover_account') }}">ฉันลืมรหัสผ่าน</a>{% endif %}
</p>
{% endblock %}
